name: Gitleaks Secret Scan

on:
  workflow_call:
  pull_request:

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Referencia o secret da Org
